[project]
name = "cmdseal-gui"
version = "0.0.1"
description = "PySide6 GUI frontend for cmdseal"
requires-python = ">=3.13,<3.14"
# 运行时依赖（PEP 621 标准字段，uv 原生识别）
dependencies = [
    "PySide6>=6.8,<6.10",
]

# 按 PEP 735 的 dependency-groups 管理"非运行时"依赖。
# 日常开发：`uv sync`（只装 dependencies）
# 打包 .app：`uv sync --group packaging`
[dependency-groups]
packaging = [
    "pyinstaller>=6.10",
]

[tool.uv]
# cmdseal-gui 不对外发布为 wheel，仅作依赖管理入口。
package = false
